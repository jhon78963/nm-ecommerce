name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright checkout E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    env:
      STORE_WAREHOUSE_ID: e2e-warehouse
      NEXT_PUBLIC_APP_URL: http://localhost:3015
      ECOMMERCE_SERVICE_URL: http://127.0.0.1:3012
      API_BASE_URL: http://127.0.0.1:3000/api/v1
      NEXT_PUBLIC_CULQI_PUBLIC_KEY: pk_test_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build storefront
        run: npm run build
        env:
          STORE_WAREHOUSE_ID: e2e-warehouse
          NEXT_PUBLIC_APP_URL: http://localhost:3015
          NEXT_PUBLIC_CULQI_PUBLIC_KEY: pk_test_e2e
          ECOMMERCE_SERVICE_URL: http://127.0.0.1:3012
          API_BASE_URL: http://127.0.0.1:3000/api/v1

      - name: Run checkout E2E
        run: npm run test:e2e

  deploy:
    name: Trigger production deploy
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch deploy to nm-deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: jhon78963/nm-deploy
          event-type: deploy-production
          client-payload: |
            {
              "repo": "nm-ecommerce",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref_name }}"
            }
